name: platform-evidence

on:
  pull_request:
    paths:
      - ".github/workflows/platform-evidence.yml"
      - "scripts/**"
      - "config/**"
      - "templates/**"
      - "VERSION"
  # Deliberately NOT `push: [main]`. A release candidate does need evidence, but
  # adding a default-branch trigger here would give this workflow -- which checks
  # out a contributor's exact head SHA and runs it -- write access to the
  # default-branch Actions cache scope. `release.yml` instead proves that the
  # candidate's tree is identical to a head whose `evidence-gate` is green, which
  # is a property `main`'s ruleset already guarantees. See verify-candidate.
  #
  # No `sha` input either. It accepted any commit reachable from this repository,
  # which includes a fork's PR head under refs/pull/*, and a dispatch runs in the
  # default-branch context. A dispatch now verifies the ref it was dispatched
  # against, which the dispatcher could already push to.
  workflow_dispatch:

permissions: {}

concurrency:
  group: platform-evidence-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  macos-native:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lane: [macos-gui, macos-no-gui]
    steps:
      - name: Checkout exact public commit without credentials
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EVIDENCE_SHA"
          git checkout --detach "$EVIDENCE_SHA"
      - name: Native Apple Silicon apply and strict verification
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/platform-evidence.sh "${{ matrix.lane }}" "$RUNNER_TEMP/evidence"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1

  ubuntu-native:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            lane: ubuntu-desktop-no-gui
          - runner: ubuntu-24.04-arm
            lane: ubuntu-desktop-no-gui
          - runner: ubuntu-24.04-arm
            lane: ubuntu-arm-gui-refusal
    steps:
      - name: Checkout exact public commit without credentials
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EVIDENCE_SHA"
          git checkout --detach "$EVIDENCE_SHA"
      - name: Native Ubuntu evidence
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/platform-evidence.sh "${{ matrix.lane }}" "$RUNNER_TEMP/evidence"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.runner }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1

  ubuntu-systemd-sandbox:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        lane:
          - sandbox-desktop-builds-rootful
          - sandbox-server-none
          - sandbox-server-rootful
          - sandbox-server-rootless
        exclude:
          - runner: ubuntu-24.04-arm
            lane: sandbox-server-rootless
    steps:
      - name: Checkout exact public commit without credentials
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EVIDENCE_SHA"
          git checkout --detach "$EVIDENCE_SHA"
      - name: Disposable systemd apply and strict verification
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/platform-evidence.sh "${{ matrix.lane }}" "$RUNNER_TEMP/evidence"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.runner }}-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1

  ubuntu-safeguards:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact public commit without credentials
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EVIDENCE_SHA"
          git checkout --detach "$EVIDENCE_SHA"
      - name: Disposable SSH, UFW, and Fail2ban apply evidence
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/platform-evidence.sh sandbox-server-hardening "$RUNNER_TEMP/evidence"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-ubuntu-24.04-server-safeguards-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1

  evidence-gate:
    if: always()
    runs-on: ubuntu-24.04
    needs: [macos-native, ubuntu-native, ubuntu-systemd-sandbox, ubuntu-safeguards]
    permissions:
      actions: read
    steps:
      - name: Require every evidence lane
        env:
          MACOS_RESULT: ${{ needs.macos-native.result }}
          UBUNTU_NATIVE_RESULT: ${{ needs.ubuntu-native.result }}
          UBUNTU_SANDBOX_RESULT: ${{ needs.ubuntu-systemd-sandbox.result }}
          UBUNTU_SAFEGUARDS_RESULT: ${{ needs.ubuntu-safeguards.result }}
        run: |
          set -euo pipefail
          for result in "$MACOS_RESULT" "$UBUNTU_NATIVE_RESULT" "$UBUNTU_SANDBOX_RESULT" "$UBUNTU_SAFEGUARDS_RESULT"; do
            [ "$result" = success ] || exit 1
          done

      # The job results above prove only that four jobs exited zero. They cannot
      # distinguish a lane that proved its declared capabilities from one that
      # restated them, and they cannot see a lane that silently disappeared from
      # a matrix. The steps below open every artifact.
      - name: Checkout exact public commit without credentials
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EVIDENCE_SHA"
          git checkout --detach "$EVIDENCE_SHA"

      - name: Download every evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-*
          path: downloaded-evidence

      - name: Verify the evidence supports what the matrix declares
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_evidence_artifacts.py downloaded-evidence --sha "$EVIDENCE_SHA"
